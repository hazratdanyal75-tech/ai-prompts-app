<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0b0f19">
    <meta name="description" content="AI Prompts Hub - Copy high-quality prompts for Midjourney, DALL-E 3, and Leonardo AI">
    <title>PromptVault AI - Pro Image Prompts</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0b0f19;
            --bg-secondary: #131a2a;
            --bg-card: rgba(23, 31, 48, 0.85);
            --accent-primary: #6366f1;
            --accent-secondary: #ec4899;
            --accent-gradient: linear-gradient(135deg, #6366f1 0%, #a855f7 50%, #ec4899 100%);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: rgba(255, 255, 255, 0.08);
            --success: #10b981;
            --radius-lg: 20px;
            --radius-md: 14px;
            --radius-sm: 10px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-main);
            min-height: 100vh;
            padding-bottom: 90px;
            overflow-x: hidden;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg-primary);
        }
        ::-webkit-scrollbar-thumb {
            background: #2d3748;
            border-radius: 10px;
        }

        /* Header / Top App Bar */
        header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(11, 15, 25, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border-color);
            padding: 16px 20px;
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1200px;
            margin: 0 auto 14px auto;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-icon {
            width: 38px;
            height: 38px;
            border-radius: 12px;
            background: var(--accent-gradient);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 18px;
            color: white;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4);
        }

        .logo-text h1 {
            font-size: 19px;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        .logo-text span {
            font-size: 11px;
            color: var(--text-muted);
            display: block;
        }

        .pro-badge {
            background: rgba(99, 102, 241, 0.15);
            border: 1px solid rgba(99, 102, 241, 0.4);
            color: #a5b4fc;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
        }

        /* Search Bar */
        .search-container {
            max-width: 1200px;
            margin: 0 auto;
            position: relative;
        }

        .search-input {
            width: 100%;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            padding: 13px 16px 13px 44px;
            color: var(--text-main);
            font-size: 14px;
            outline: none;
            transition: all 0.25s ease;
        }

        .search-input:focus {
            border-color: var(--accent-primary);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
        }

        .search-icon {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            width: 18px;
            height: 18px;
        }

        /* Category Pills */
        .categories-wrapper {
            max-width: 1200px;
            margin: 16px auto 0 auto;
            padding: 0 20px;
            display: flex;
            gap: 10px;
            overflow-x: auto;
            scrollbar-width: none;
        }
        .categories-wrapper::-webkit-scrollbar {
            display: none;
        }

        .cat-pill {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 9px 16px;
            border-radius: 30px;
            font-size: 13px;
            font-weight: 600;
            white-space: nowrap;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .cat-pill.active {
            background: var(--accent-gradient);
            color: white;
            border-color: transparent;
            box-shadow: 0 4px 12px rgba(168, 85, 247, 0.35);
        }

        /* Main Container */
        main {
            max-width: 1200px;
            margin: 20px auto;
            padding: 0 20px;
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .section-title {
            font-size: 17px;
            font-weight: 700;
        }

        .prompt-count {
            font-size: 12px;
            color: var(--text-muted);
            background: var(--bg-secondary);
            padding: 4px 10px;
            border-radius: 12px;
        }

        /* Prompts Grid */
        .prompts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 18px;
        }

        .prompt-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: transform 0.25s ease, border-color 0.25s ease;
        }

        .prompt-card:hover {
            transform: translateY(-4px);
            border-color: rgba(99, 102, 241, 0.4);
        }

        .card-preview {
            position: relative;
            height: 175px;
            width: 100%;
            overflow: hidden;
            cursor: pointer;
        }

        .card-preview img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.4s ease;
        }

        .prompt-card:hover .card-preview img {
            transform: scale(1.06);
        }

        .card-badges {
            position: absolute;
            top: 12px;
            left: 12px;
            right: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .tag-badge {
            background: rgba(11, 15, 25, 0.75);
            backdrop-filter: blur(8px);
            padding: 5px 10px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 600;
            color: #e2e8f0;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .fav-btn {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            background: rgba(11, 15, 25, 0.75);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255,255,255,0.1);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .fav-btn.saved {
            color: #ec4899;
            background: rgba(236, 72, 153, 0.15);
            border-color: #ec4899;
        }

        .card-body {
            padding: 16px;
            display: flex;
            flex-direction: column;
            flex: 1;
        }

        .card-title {
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 8px;
            color: var(--text-main);
        }

        .prompt-box {
            background: rgba(11, 15, 25, 0.6);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            padding: 11px;
            font-size: 12.5px;
            line-height: 1.5;
            color: #cbd5e1;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
            margin-bottom: 14px;
            flex: 1;
        }

        .card-actions {
            display: flex;
            gap: 10px;
        }

        .btn-copy {
            flex: 1;
            background: var(--accent-gradient);
            border: none;
            border-radius: var(--radius-sm);
            color: white;
            padding: 11px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: opacity 0.2s ease;
        }

        .btn-copy:active {
            transform: scale(0.97);
        }

        .btn-view {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            color: var(--text-main);
            padding: 11px 14px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
        }

        /* Prompt Builder Tab View */
        .builder-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 20px;
            max-width: 650px;
            margin: 0 auto;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 8px;
        }

        .form-control {
            width: 100%;
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            padding: 12px;
            color: var(--text-main);
            font-size: 14px;
            outline: none;
        }

        .generated-output {
            background: var(--bg-primary);
            border: 1px dashed var(--accent-primary);
            border-radius: var(--radius-sm);
            padding: 14px;
            margin-top: 16px;
            font-size: 13.5px;
            line-height: 1.6;
            color: #e2e8f0;
            min-height: 80px;
        }

        /* Modal */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(8px);
            z-index: 200;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal-overlay.open {
            display: flex;
        }

        .modal-content {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            max-width: 500px;
            width: 100%;
            overflow: hidden;
            animation: slideUp 0.25s ease;
        }

        @keyframes slideUp {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .modal-img {
            width: 100%;
            height: 220px;
            object-fit: cover;
        }

        .modal-body {
            padding: 20px;
        }

        .modal-meta {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin: 10px 0 14px 0;
        }

        .meta-chip {
            background: rgba(99, 102, 241, 0.15);
            color: #a5b4fc;
            font-size: 11px;
            padding: 4px 10px;
            border-radius: 6px;
            font-weight: 600;
        }

        .full-prompt-text {
            background: var(--bg-primary);
            padding: 14px;
            border-radius: var(--radius-sm);
            font-size: 13.5px;
            line-height: 1.6;
            color: #f1f5f9;
            margin-bottom: 16px;
            border: 1px solid var(--border-color);
        }

        /* Bottom Navigation Bar (Mobile App Feel) */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(19, 26, 42, 0.95);
            backdrop-filter: blur(16px);
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: space-around;
            padding: 10px 0 14px 0;
            z-index: 150;
        }

        .nav-item {
            background: none;
            border: none;
            color: var(--text-muted);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            transition: color 0.2s ease;
        }

        .nav-item.active {
            color: #a855f7;
        }

        /* Toast Notification */
        .toast {
            position: fixed;
            bottom: 85px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: var(--success);
            color: #064e3b;
            font-weight: 700;
            font-size: 13px;
            padding: 11px 22px;
            border-radius: 30px;
            box-shadow: 0 10px 25px rgba(16, 185, 129, 0.4);
            opacity: 0;
            pointer-events: none;
            transition: all 0.3s ease;
            z-index: 300;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        .empty-state {
            text-align: center;
            padding: 50px 20px;
            color: var(--text-muted);
            grid-column: 1 / -1;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <!-- Top Header -->
    <header>
        <div class="header-top">
            <div class="logo-area">
                <div class="logo-icon">AI</div>
                <div class="logo-text">
                    <h1>PromptVault</h1>
                    <span>Midjourney • DALL-E 3 • Leonardo</span>
                </div>
            </div>
            <div class="pro-badge">✨ 2026 Edition</div>
        </div>

        <div class="search-container" id="searchBarBox">
            <svg class="search-icon" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-4.35-4.35m0 0A7.5 7.5 0 1010.5 18a7.5 7.5 0 006.15-3.35z"/>
            </svg>
            <input type="text" id="searchInput" class="search-input" placeholder="Search prompts (e.g., Cyberpunk, Logo, Portrait)...">
        </div>
    </header>

    <!-- Category Filter Pills -->
    <div class="categories-wrapper" id="categoryBar">
        <button class="cat-pill active" data-cat="All">🔥 All Prompts</button>
        <button class="cat-pill" data-cat="Portraits">📸 Portraits</button>
        <button class="cat-pill" data-cat="Cyberpunk">🌃 Cyberpunk</button>
        <button class="cat-pill" data-cat="3D & Logos">🎨 3D & Logos</button>
        <button class="cat-pill" data-cat="Anime">⛩️ Anime Art</button>
        <button class="cat-pill" data-cat="Fantasy">🐉 Fantasy</button>
        <button class="cat-pill" data-cat="Product">👟 Product Ad</button>
    </div>

    <!-- Main Content Area -->
    <main>
        <!-- Explore / Saved View -->
        <div id="exploreSection">
            <div class="section-header">
                <h2 class="section-title" id="viewTitle">Trending AI Prompts</h2>
                <span class="prompt-count" id="promptCounter">0 Prompts</span>
            </div>
            <div class="prompts-grid" id="promptsGrid"></div>
        </div>

        <!-- Custom Prompt Builder View -->
        <div id="builderSection" class="hidden">
            <div class="section-header">
                <h2 class="section-title">⚡ Custom Prompt Generator</h2>
            </div>
            <div class="builder-card">
                <div class="form-group">
                    <label>1. Main Subject (Aap kya banana chahte hain?)</label>
                    <input type="text" id="bSubject" class="form-control" placeholder="e.g., A futuristic Pakistani warrior in Lahore">
                </div>
                <div class="form-group">
                    <label>2. Art Style</label>
                    <select id="bStyle" class="form-control">
                        <option value="hyper-realistic photography, 8k resolution, shot on Sony A7R IV">Hyper-Realistic Photo (8K)</option>
                        <option value="Pixar 3D animation style, Unreal Engine 5 render, Octane render">3D Pixar / Disney Render</option>
                        <option value="cyberpunk neon aesthetic, rain reflections, blade runner vibe">Cyberpunk Neon</option>
                        <option value="Makoto Shinkai anime style, vibrant sky, detailed background">Anime Masterpiece</option>
                        <option value="minimalist vector logo design, flat modern branding, white background">Modern Vector Logo</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>3. Lighting & Mood</label>
                    <select id="bLighting" class="form-control">
                        <option value="cinematic volumetric lighting, golden hour glow">Cinematic Golden Hour</option>
                        <option value="dramatic rim lighting, dark moody shadows">Dark & Dramatic</option>
                        <option value="soft studio lighting, clean commercial look">Clean Studio Light</option>
                        <option value="neon blue and magenta glow, night atmosphere">Neon Night Glow</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>4. Aspect Ratio</label>
                    <select id="bRatio" class="form-control">
                        <option value="--ar 1:1">1:1 (Instagram / Profile)</option>
                        <option value="--ar 9:16">9:16 (TikTok / Reels / Wallpaper)</option>
                        <option value="--ar 16:9">16:9 (YouTube Thumbnail)</option>
                    </select>
                </div>
                <button class="btn-copy" onclick="generateCustomPrompt()" style="width: 100%; padding: 13px;">
                    ✨ Generate Pro Prompt
                </button>

                <div class="generated-output" id="builderOutput">
                    Your custom AI prompt will appear here...
                </div>
                <button class="btn-view" onclick="copyBuiltPrompt()" style="width: 100%; margin-top: 10px;">
                    📋 Copy Generated Prompt
                </button>
            </div>
        </div>
    </main>

    <!-- Prompt Detail Modal -->
    <div class="modal-overlay" id="promptModal" onclick="closeModal(event)">
        <div class="modal-content" onclick="event.stopPropagation()">
            <img id="modalImg" class="modal-img" src="" alt="Preview">
            <div class="modal-body">
                <h3 id="modalTitle" style="font-size: 18px; font-weight: 800;"></h3>
                <div class="modal-meta">
                    <span class="meta-chip" id="modalCat"></span>
                    <span class="meta-chip" id="modalModel"></span>
                    <span class="meta-chip" id="modalRatio"></span>
                </div>
                <div class="full-prompt-text" id="modalPromptText"></div>
                <div class="card-actions">
                    <button class="btn-copy" id="modalCopyBtn">📋 Copy Full Prompt</button>
                    <button class="btn-view" onclick="forceCloseModal()">Close</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast Notification -->
    <div class="toast" id="toast">✅ Prompt Copied to Clipboard!</div>

    <!-- Bottom App Navigation -->
    <nav class="bottom-nav">
        <button class="nav-item active" onclick="switchTab('explore', this)">
            <svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"/>
            </svg>
            <span>Explore</span>
        </button>
        <button class="nav-item" onclick="switchTab('builder', this)">
            <svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M13 10V3L4 14h7v7l9-11h-7z"/>
            </svg>
            <span>Builder</span>
        </button>
        <button class="nav-item" onclick="switchTab('saved', this)">
            <svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"/>
            </svg>
            <span>Saved</span>
        </button>
    </nav>

    <script>
        // Rich AI Prompts Database (Aap isme mazeed prompts asani se add kar sakte hain)
        const promptsData = [
            {

            {

            {
                id: 4,

            {

            },
            {
                id: 6,
                title: "Commercial Sneaker Ad",
                category: "Product",

        // State Variables
        let activeCategory = "All";
        let currentTab = "explore";
        let savedIds = JSON.parse(localStorage.getItem("savedPrompts")) || [];

        const grid = document.getElementById("promptsGrid");
        const searchInput = document.getElementById("searchInput");
        const promptCounter = document.getElementById("promptCounter");

        // Render Cards
        function renderPrompts() {
            const query = searchInput.value.toLowerCase().trim();
            grid.innerHTML = "";

            const filtered = promptsData.filter(item => {
                const matchesTab = currentTab === "saved" ? savedIds.includes(item.id) : true;
                const matchesCat = activeCategory === "All" || item.category === activeCategory;
                const matchesSearch = item.title.toLowerCase().includes(query) ||
                                      item.prompt.toLowerCase().includes(query) ||
                                      item.category.toLowerCase().includes(query);
                return matchesTab && matchesCat && matchesSearch;
            });

            promptCounter.textContent = `${filtered.length} Prompts`;

            if (filtered.length === 0) {
                grid.innerHTML = `
                    <div class="empty-state">
                        <h3>No prompts found 😕</h3>
                        <p style="margin-top:6px; font-size:13px;">Try another keyword or save your favorite prompts first.</p>
                    </div>
                `;
                return;
            }

            filtered.forEach(item => {
                const isSaved = savedIds.includes(item.id);
                const card = document.createElement("div");
                card.className = "prompt-card";
                card.innerHTML = `
                    <div class="card-preview" onclick="openModal(${item.id})">
                        <img src="${item.image}" alt="${item.title}" loading="lazy">
                        <div class="card-badges">
                            <span class="tag-badge">${item.category}</span>
                            <button class="fav-btn ${isSaved ? 'saved' : ''}" onclick="toggleSave(event, ${item.id})" title="Save Prompt">
                                ${isSaved ? '❤️' : '🤍'}
                            </button>
                        </div>
                    </div>
                    <div class="card-body">
                        <h3 class="card-title">${item.title}</h3>
                        <div class="prompt-box">${item.prompt}</div>
                        <div class="card-actions">
                            <button class="btn-copy" onclick="copyText('${escapeQuotes(item.prompt)}')">
                                📋 Copy Prompt
                            </button>
                            <button class="btn-view" onclick="openModal(${item.id})">View</button>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        // Escape quotes for inline onclick
        function escapeQuotes(str) {
            return str.replace(/'/g, "\\'").replace(/"/g, '&quot;');
        }

        // Copy to Clipboard Function
        function copyText(text) {
            navigator.clipboard.writeText(text).then(() => {
                showToast("✅ Prompt Copied! Paste in Midjourney / Bing / Leonardo");
            }).catch(() => {
                const textarea = document.createElement("textarea");
                textarea.value = text;
                document.body.appendChild(textarea);
                textarea.select();
                document.execCommand("copy");
                document.body.removeChild(textarea);
                showToast("✅ Prompt Copied!");
            });
        }

        // Toast Notification
        function showToast(msg) {
            const toast = document.getElementById("toast");
            toast.textContent = msg;
            toast.classList.add("show");
            setTimeout(() => {
                toast.classList.remove("show");
            }, 2500);
        }

        // Save / Bookmark Prompt
        function toggleSave(e, id) {
            e.stopPropagation();
            if (savedIds.includes(id)) {
                savedIds = savedIds.filter(item => item !== id);
                showToast("Removed from Saved");
            } else {
                savedIds.push(id);
                showToast("❤️ Saved to Favorites!");
            }
            localStorage.setItem("savedPrompts", JSON.stringify(savedIds));
            renderPrompts();
        }

        // Category Filter Clicks
        document.querySelectorAll(".cat-pill").forEach(btn => {
            btn.addEventListener("click", () => {
                document.querySelectorAll(".cat-pill").forEach(b => b.classList.remove("active"));
                btn.classList.add("active");
                activeCategory = btn.getAttribute("data-cat");
                renderPrompts();
            });
        });

        // Search Listener
        searchInput.addEventListener("input", renderPrompts);

        // Modal Functions
        function openModal(id) {
            const item = promptsData.find(p => p.id === id);
            if (!item) return;

            document.getElementById("modalImg").src = item.image;
            document.getElementById("modalTitle").textContent = item.title;
            document.getElementById("modalCat").textContent = item.category;
            document.getElementById("modalModel").textContent = item.model;
            document.getElementById("modalRatio").textContent = item.ratio;
            document.getElementById("modalPromptText").textContent = item.prompt;

            const copyBtn = document.getElementById("modalCopyBtn");
            copyBtn.onclick = () => copyText(item.prompt);

            document.getElementById("promptModal").classList.add("open");
        }

        function closeModal(e) {
            if (e.target.id === "promptModal") {
                forceCloseModal();
            }
        }

        function forceCloseModal() {
            document.getElementById("promptModal").classList.remove("open");
        }

        // Bottom Tab Navigation
        function switchTab(tab, el) {
            currentTab = tab;
            document.querySelectorAll(".nav-item").forEach(n => n.classList.remove("active"));
            el.classList.add("active");

            const exploreSec = document.getElementById("exploreSection");
            const builderSec = document.getElementById("builderSection");
            const catBar = document.getElementById("categoryBar");
            const searchBox = document.getElementById("searchBarBox");
            const viewTitle = document.getElementById("viewTitle");

            if (tab === "builder") {
                exploreSec.classList.add("hidden");
                catBar.classList.add("hidden");
                searchBox.classList.add("hidden");
                builderSec.classList.remove("hidden");
            } else {
                builderSec.classList.add("hidden");
                exploreSec.classList.remove("hidden");
                catBar.classList.remove("hidden");
                searchBox.classList.remove("hidden");
                viewTitle.textContent = tab === "saved" ? "❤️ Your Saved Prompts" : "Trending AI Prompts";
                renderPrompts();
            }
        }

        // Custom Prompt Builder Logic
        function generateCustomPrompt() {
            const subject = document.getElementById("bSubject").value.trim();
            const style = document.getElementById("bStyle").value;
            const lighting = document.getElementById("bLighting").value;
            const ratio = document.getElementById("bRatio").value;

            if (!subject) {
                showToast("⚠️ Please enter a subject first!");
                return;
            }

            const finalPrompt = `${subject}, ${style}, ${lighting}, ultra-detailed, masterpiece quality ${ratio}`;
            document.getElementById("builderOutput").textContent = finalPrompt;
        }

        function copyBuiltPrompt() {
            const text = document.getElementById("builderOutput").textContent;
            if (text.includes("will appear here")) {
                showToast("⚠️ Generate a prompt first!");
                return;
            }
            copyText(text);
        }

        // Initialize App
        renderPrompts();
    </script>
